name: Build DriftArchInf ISO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Позволяет запускать сборку вручную кнопкой

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged # Нужно для работы mkarchiso

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          # Добавили meson и ninja для сборки sfwbar
          pacman -S --noconfirm archiso base-devel git sudo rust clang cmake meson ninja

      - name: Build AUR packages (driftwm & sfwbar)
        run: |
          # makepkg нельзя запускать от root, поэтому создаем юзера
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder .
          
          # Собираем оба пакета из AUR
          sudo -u builder bash -c '
            cd /tmp
            
            # 1. Сборка driftwm
            git clone https://aur.archlinux.org/driftwm-git.git
            cd driftwm-git
            makepkg -s --noconfirm
            cd ..

            # 2. Сборка sfwbar
            git clone https://aur.archlinux.org/sfwbar.git
            cd sfwbar
            makepkg -s --noconfirm
          '
          
          # Копируем собранные пакеты в локальный репозиторий профиля ISO
          mkdir -p iso/airootfs/root/local_repo
          cp /tmp/driftwm-git/*.pkg.tar.zst iso/airootfs/root/local_repo/
          cp /tmp/sfwbar/*.pkg.tar.zst iso/airootfs/root/local_repo/
          repo-add iso/airootfs/root/local_repo/driftarchinf.db.tar.gz iso/airootfs/root/local_repo/*.pkg.tar.zst
          
          # ВАЖНО: Копируем в /root/local_repo на самой машине, чтобы mkarchiso его нашел
          mkdir -p /root/local_repo
          cp /tmp/driftwm-git/*.pkg.tar.zst /root/local_repo/
          cp /tmp/sfwbar/*.pkg.tar.zst /root/local_repo/
          repo-add /root/local_repo/driftarchinf.db.tar.gz /root/local_repo/*.pkg.tar.zst

      - name: Build ISO
        run: |
          # Собираем ISO
          mkarchiso -v -w ./work -o ./out ./iso

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DriftArchInf-ISO
          path: out/*.iso
          retention-days: 7
