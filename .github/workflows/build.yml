name: Build DriftArchInf ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm archiso base-devel git sudo rust clang cmake meson ninja go dkms linux-headers

      - name: Cache AUR packages
        id: cache-aur
        uses: actions/cache@v4
        with:
          path: /tmp/cached_pkgs
          key: ${{ runner.os }}-aur-pkgs-v2

      - name: Build AUR packages
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder .
          
          if [ "${{ steps.cache-aur.outputs.cache-hit }}" == "true" ]; then
            echo "✅ Пакеты найдены в кэше! Пропускаем компиляцию."
          else
            echo "⏳ Пакетов в кэше нет. Собираем с нуля..."
            sudo -u builder bash -c '
              cd /tmp
              
              git clone https://aur.archlinux.org/driftwm-git.git
              cd driftwm-git && makepkg -s --noconfirm && cd ..
              
              git clone https://aur.archlinux.org/sfwbar.git
              cd sfwbar && makepkg -s --noconfirm && cd ..

              git clone https://aur.archlinux.org/amneziavpn-bin.git
              cd amneziavpn-bin && makepkg -s --noconfirm && cd ..

              git clone https://aur.archlinux.org/amneziawg-tools-git.git
              cd amneziawg-tools-git && makepkg -s --noconfirm && cd ..

              git clone https://aur.archlinux.org/amneziawg-dkms-git.git
              cd amneziawg-dkms-git && makepkg -s --noconfirm && cd ..

              git clone https://aur.archlinux.org/tun2socks.git
              cd tun2socks && makepkg -s --noconfirm && cd ..

              git clone https://aur.archlinux.org/chwd-arch-git.git
              cd chwd-arch-git && makepkg -s --noconfirm && cd ..
              
              # Заменили paru-bin на yay-bin
              git clone https://aur.archlinux.org/yay-bin.git
              cd yay-bin && makepkg -s --noconfirm && cd ..
            '
            mkdir -p /tmp/cached_pkgs
            cp /tmp/*/*.pkg.tar.zst /tmp/cached_pkgs/
          fi
          
          mkdir -p iso/airootfs/root/local_repo
          cp /tmp/cached_pkgs/*.pkg.tar.zst iso/airootfs/root/local_repo/
          repo-add iso/airootfs/root/local_repo/driftarchinf.db.tar.gz iso/airootfs/root/local_repo/*.pkg.tar.zst
          
          mkdir -p /root/local_repo
          cp /tmp/cached_pkgs/*.pkg.tar.zst /root/local_repo/
          repo-add /root/local_repo/driftarchinf.db.tar.gz /root/local_repo/*.pkg.tar.zst

      - name: Build ISO
        run: |
          pacman -Scc --noconfirm
          mkarchiso -v -w ./work -o ./out -C ./iso/pacman.conf ./iso

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DriftArchInf-ISO
          path: out/*.iso
          retention-days: 7
