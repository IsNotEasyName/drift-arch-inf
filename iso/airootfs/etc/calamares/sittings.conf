# Настройки Calamares для DriftArchInf
modules-search: [ local ]

# Последовательность шагов установки
sequence:
  - show:
    - welcome
    - locale
    - keyboard
    - partition
    - users
    - summary
  - exec:
    - partition
    - mount
    - unpackfs
    - machineid
    - fstab
    - locale
    - keyboard
    - localecfg
    - users
    - displaymanager
    - networkcfg
    - hwclock
    - services-systemd
    - bootloader-config
    - grubcfg
    - bootloader
    - umount
  - show:
    - finished

# Брендинг (настройки внешнего вида)
branding: driftarchinf

# Настройки отладки (для тестов)
debug: false
